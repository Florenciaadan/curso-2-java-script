<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>gestor de viajes</title>

    <link rel="stylesheet" href="./css/style.css">

    <script src="./js/main.js" defer></script>
</head>

<body>

    <header>

        <h1>gestor de viajes</h1>

        <p>
            organizá tus proximas vacaciones y elegí el paquete que mas te conviene
        </p>

    </header>


    <main>

        <section class="formulario">

            <h2>agregar un paquete</h2>

            <form id="formulario-paquete">

                <div class="campo">

                    <label for="destino">
                        destino
                    </label>

                    <input
                        type="text"
                        id="destino"
                        placeholder="ej: brasil"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="precio">
                        precio
                    </label>

                    <input
                        type="number"
                        id="precio"
                        placeholder="ej: 500"
                        min="1"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="dias">
                        dias
                    </label>

                    <input
                        type="number"
                        id="dias"
                        placeholder="ej: 7"
                        min="1"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="personas">
                        personas
                    </label>

                    <input
                        type="number"
                        id="personas"
                        placeholder="ej: 2"
                        min="1"
                        required
                    >

                </div>


                <button type="submit">
                    agregar paquete
                </button>

            </form>

        </section>


        <section class="busqueda">

            <h2>buscar destino</h2>

            <input
                type="text"
                id="buscador"
                placeholder="escribi un destino..."
            >

        </section>


        <section class="paquetes">

            <div class="titulo-seccion">

                <h2>paquetes disponibles</h2>

                <span id="cantidad-paquetes"></span>

            </div>


            <div id="contenedor-paquetes"></div>

        </section>


        <section class="carrito">

            <div class="titulo-seccion">

                <h2>mi carrito</h2>

                <span id="cantidad-carrito"></span>

            </div>


            <div id="contenedor-carrito"></div>

            <div id="total-carrito"></div>

        </section>


        <div id="mensaje"></div>

    </main>

</body>
</html>
