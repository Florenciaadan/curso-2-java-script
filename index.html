<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Para que la página se adapte también al celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agencia de viajes</title>

    <!-- Acá conecto el archivo de estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- Con defer hago que el JS cargue después del HTML -->
    <script src="main.js" defer></script>
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

            <div class="icono">✈️</div>

            <h1>Agencia de viajes</h1>

            <p class="subtitulo">
                Calculá cuánto necesitás para disfrutar tu próximo viaje.
            </p>

            <div class="decoracion"></div>

            <h2>¿Lista para viajar?</h2>

            <p class="descripcion">
                Completá los datos que te vamos a pedir
                y calcularemos un presupuesto estimado.
            </p>

            <!-- Este botón inicia el simulador -->
            <button onclick="iniciarSimulador()">
                Comenzar mi viaje ✈️
            </button>

        </section>

    </main>

</body>
</html>
