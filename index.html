<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Planner</title>

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

            <div class="icono">✈️</div>

            <h1>Travel Planner</h1>

            <p class="subtitulo">
                Calculá cuánto necesitás para disfrutar tu próximo viaje.
            </p>

            <div class="decoracion"></div>

            <h2>¿Listo para viajar?</h2>

            <p class="descripcion">
                Completá los datos que te vamos a solicitar
                y calcularemos un presupuesto estimado para tu viaje.
            </p>

            <button onclick="iniciarSimulador()">
                Comenzar mi viaje ✈️
            </button>

        </section>

    </main>

</body>
</html>
