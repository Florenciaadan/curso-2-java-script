<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>gestor de viajes</title>

    <link rel="stylesheet" href="./estilos.css">

    <script src="./js/main.js" defer></script>

</head>


<body>

    <header>

        <h1>gestor de viajes</h1>

        <p>
            encontrá tu proximo viaje y consultá el precio
        </p>

    </header>


    <main>

        <!-- formulario para consultar un viaje -->

        <section class="consulta">

            <h2>consultar viaje</h2>


            <form id="formulario-viaje">


                <div class="campo">

                    <label for="destino">
                        destino
                    </label>


                    <select id="destino">

                        <option value="brasil">
                            brasil
                        </option>

                        <option value="peru">
                            peru
                        </option>

                        <option value="colombia">
                            colombia
                        </option>

                        <option value="chile">
                            chile
                        </option>

                        <option value="mexico">
                            mexico
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="personas">
                        personas
                    </label>


                    <input
                        type="number"
                        id="personas"
                        min="1"
                        value="2"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="dias">
                        dias
                    </label>


                    <input
                        type="number"
                        id="dias"
                        min="1"
                        value="5"
                        required
                    >

                </div>


                <button type="submit">
                    consultar viaje
                </button>


            </form>

        </section>


        <!-- buscador -->

        <section class="busqueda">

            <h2>buscar destino</h2>


            <input
                type="text"
                id="buscador"
                placeholder="escribi un destino..."
            >

        </section>


        <!-- destinos disponibles -->

        <section>

            <h2>destinos disponibles</h2>


            <p id="cantidad-paquetes"></p>


            <div id="contenedor-paquetes"></div>

        </section>


        <!-- cotizacion -->

        <section>

            <h2>mi cotizacion</h2>


            <div id="contenedor-cotizacion">

                <p>
                    todavia no realizaste una consulta
                </p>

            </div>

        </section>


        <!-- carrito -->

        <section>

            <h2>mi carrito</h2>


            <p id="cantidad-carrito"></p>


            <div id="contenedor-carrito"></div>


            <div id="total-carrito"></div>

        </section>


        <!-- mensaje -->

        <div id="mensaje"></div>


    </main>


</body>

</html>
